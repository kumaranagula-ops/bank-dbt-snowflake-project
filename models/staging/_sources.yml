version: 2

sources:
  - name: raw
    database: BANK_DB
    schema: RAW
    tables:
      - name: raw_branches
        description: "Static reference list of bank branches."
        columns:
          - name: branch_id
            tests: [unique, not_null]

      - name: raw_customers
        description: "One row per customer, loaded from S3 customer extract."
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 168, period: hour}
        columns:
          - name: customer_id
            tests: [unique, not_null]
          - name: kyc_status
            tests:
              - accepted_values:
                  arguments:
                    values: ['VERIFIED', 'PENDING', 'REJECTED']

      - name: raw_accounts
        description: "Savings account master data. Reloaded periodically; snapshotted for SCD2 history."
        config:
          loaded_at_field: updated_at
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 168, period: hour}
        columns:
          - name: account_id
            tests: [unique, not_null]
          - name: customer_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_customers')
                    field: customer_id
          - name: account_status
            tests:
              - accepted_values:
                  arguments:
                    values: ['ACTIVE', 'DORMANT', 'CLOSED']

      - name: raw_transactions
        description: "Transaction-level ledger. Appended to continuously (deposits, withdrawals, transfers, fees)."
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
        columns:
          - name: transaction_id
            tests: [unique, not_null]
          - name: account_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'raw_accounts')
                    field: account_id
          - name: txn_type
            tests:
              - accepted_values:
                  arguments:
                    values: ['DEPOSIT', 'WITHDRAWAL', 'INTEREST_CREDIT', 'FEE_DEBIT', 'UPI_TRANSFER']
